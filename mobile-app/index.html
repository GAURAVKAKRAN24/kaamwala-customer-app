<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#059669" />
    <title>KaamWala — Customer App | कामवाला</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#ecfdf5',
                100: '#d1fae5',
                200: '#a7f3d0',
                300: '#6ee7b7',
                400: '#34d399',
                500: '#10b981',
                600: '#059669',
                700: '#047857',
                800: '#065f46',
                900: '#064e3b',
              },
              saffron: {
                500: '#f97316',
                600: '#ea580c'
              }
            },
            fontFamily: {
              sans: ['Inter', 'Noto Sans Devanagari', 'system-ui', '-apple-system', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
        overscroll-behavior-y: none;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .safe-bottom {
        padding-bottom: env(safe-area-inset-bottom, 16px);
      }
      .safe-top {
        padding-top: env(safe-area-inset-top, 0px);
      }
    </style>
  </head>
  <body class="bg-slate-900 sm:bg-slate-100 min-h-screen text-slate-800 antialiased flex justify-center">
    <div id="root" class="w-full max-w-md min-h-screen bg-slate-50 flex flex-col relative sm:shadow-2xl sm:my-3 sm:rounded-[36px] overflow-hidden border-slate-200"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
